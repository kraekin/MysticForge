[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mysticforge"
version = "0.2.0a202609"
description = "MysticForge: Final Fantasy Mystic Quest editor"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6,<7", "numpy>=1.26,<3"]

[project.scripts]
mysticforge = "ffmq_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ffmq_editor = ["data/*.bin", "data/*.json", "data/*.ico", "data/*.png", "data/*.svg"]
